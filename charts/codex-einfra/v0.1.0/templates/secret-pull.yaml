{{- if .Values.harborPull.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-harbor-pull
  labels:
    {{- include "codex-einfra.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{\"cerit.io\":{\"username\":%q,\"password\":%q}}}" .Values.harborPull.username .Values.harborPull.password | quote }}
{{- end }}

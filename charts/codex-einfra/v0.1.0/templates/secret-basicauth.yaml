{{- $user := required "basicAuth.username is required" .Values.basicAuth.username }}
{{- $pass := required "basicAuth.password is required" .Values.basicAuth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-basic-auth
  labels:
    {{- include "codex-einfra.labels" . | nindent 4 }}
type: Opaque
stringData:
  users: {{ htpasswd $user $pass | quote }}
